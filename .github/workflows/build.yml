name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Cari proyek
        id: proj
        run: |
          if [ -f FloatingApp.zip ]; then
            unzip -o -q FloatingApp.zip
          fi
          SETTINGS=$(grep -rl --include=settings.gradle 'rootProject.name = "FloatingApp"' . | head -n 1 || true)
          if [ -z "$SETTINGS" ]; then
            echo "Proyek FloatingApp tidak ditemukan. Isi repo:"
            ls -la
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyek ada di: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FloatingApp-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
