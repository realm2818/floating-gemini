name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Extract Zip
        run: |
          unzip -o FloatingGemini.zip
          ls -la

      - name: Fix Icon in Manifest
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' {} \;

      - name: Build APK
        run: |
          cd FLOATINGGEMINI
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-gemini-apk
          path: FLOATINGGEMINI/app/build/outputs/apk/debug/app-debug.apk
