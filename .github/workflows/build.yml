name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Extract Zip
        run: |
          unzip -o FloatingGemini.zip
          find . -name "settings.gradle"

      - name: Override GeminiApiClient
        run: |
          TARGET=$(find . -path "*/floatinggemini/GeminiApiClient.kt" | head -1)
          echo "Target: $TARGET"
          cp GeminiApiClient.kt "$TARGET"

      - name: Fix Icon in Manifest
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' {} \;

      - name: Create gradle.properties
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" | head -1 | xargs dirname)
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-gemini-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
