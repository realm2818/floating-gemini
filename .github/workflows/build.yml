name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # ⬇️ TAMBAH INI — Step buat setup fixed keystore
      - name: Setup Fixed Keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            cp debug.keystore ~/.android/debug.keystore
            echo "✅ Pakai keystore yang udah ada"
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp ~/.android/debug.keystore debug.keystore
            echo "✅ Generate keystore baru"
          fi

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: warn
      # ⬆️ SAMPAI SINI

      - name: Extract Zip
        run: |
          unzip -o FloatingGemini.zip
          find . -name "settings.gradle"

      - name: Override GeminiApiClient
        run: |
          TARGET=$(find . -path "*/floatinggemini/GeminiApiClient.kt" | head -1)
          echo "Target: $TARGET"
          cp GeminiApiClient.kt "$TARGET"

      - name: Fix Icon in Manifest
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's|@mipmap/ic_launcher|@android:drawable/sym_def_app_icon|g' {} \;

      - name: Create gradle.properties
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" | head -1 | xargs dirname)
          echo "android.useAndroidX=true" > "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" | head -1 | xargs dirname)
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: floating-gemini-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
